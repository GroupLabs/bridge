[package]
name = "core"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "core"
path = "src/main.rs"

[[bin]]
name = "hybrid_bench"
path = "src/bin/hybrid_bench.rs"

[[bin]]
name = "sift1m_multicore"
path = "src/bin/sift1m_multicore.rs"

[[bin]]
name = "hybrid_bench_multicore"
path = "src/bin/hybrid_bench_multicore.rs"

[dependencies]
arc-swap = "1.7"
actix-web = "4.9.0"
anyhow = "1.0.100"
bindgen = "0.71.1"
bincode = "1.3"
crc32fast = "1.5.0"
dashmap = "6.1.0"
env_logger = "0.11.5"
half = "2.4"
libc = "0.2.168"
log = "0.4.22"
parking_lot = "0.12"
rand = "0.8"
rayon = "1.11.0"
seekstorm = { git = "https://github.com/SeekStorm/SeekStorm.git" }
rmp-serde = "1.3"
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.133"
tokio = { version = "1.42.0", features = ["full"] }
tempfile = "3.10"

[features]
default = []
fdb = []  # Enable FDB integration (requires building foundationdb submodule)

[build-dependencies]
bindgen = "0.71.1"
cc = "1.0"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.10"

[lib]
name = "core"
path = "src/lib.rs"

[[bench]]
name = "sift1m_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
